version: '3.8'

services:
  telegram-api:
    image: telegrammessenger/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: always
    environment:
      - TELEGRAM_API_ID=38456866
      - TELEGRAM_API_HASH=30a8f347f538733a1d57dae8cc458ddc
    ports:
      - "8081:8081"
      - "8082:8082"

  bot:
    build: .
    container_name: amazon_bot
    restart: always
    depends_on:
      - telegram-api
    environment:
      - BOT_TOKEN=8454384380:AAHTm8LaUK5M8RJYs6JK3CzzWIrNH8XG_5E
      - LOCAL_SERVER=True
